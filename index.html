<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="Healing Time - 癒やしの時間を表示するWebアプリ">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Healing Time">
  <title>Healing Time</title>

  <!-- Web App manifest (このHTMLだけで動作する最小構成) -->
  <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Healing%20Time%22%2C%22short_name%22%3A%22Healing%20Time%22%2C%22start_url%22%3A%22.%2F%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23111827%22%2C%22theme_color%22%3A%22%23111827%22%7D">

  <!-- BIZ UDPGothic -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="tv-screen" role="application" aria-label="Healing Time">
    <!--
      現在は背景をCSSで作っています。
      後で実写映像・画像・動画に差し替えられるようにしてあります。
    -->
    <div class="background"></div>

    <time class="clock" id="clock" datetime="PT0M">0:00</time>
  </main>

  <script src="script.js"></script>
</body>
</html>
